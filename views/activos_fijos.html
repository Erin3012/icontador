<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../assets/theme.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activos Fijos - Gestión Patrimonial</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            gap: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            background: #e8e8e8;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .kpi-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .kpi-card .value {
            font-size: 24px;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            font-weight: 600;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            color: #333;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .currency {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #3c3;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .kpi-cards {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            header h1 {
                font-size: 22px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 1 1 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Activos Fijos</h1>
            <p>Gestión de activos, depreciaciones y reportes patrimoniales</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('reporte')">📊 Reporte de Activos</button>
            <button class="tab-btn" onclick="cambiarTab('nuevo')">➕ Registrar Activo</button>
            <button class="tab-btn" onclick="cambiarTab('baja')">🗑️ Dar de Baja</button>
        </div>

        <div class="tab-content active" id="tab-reporte">
            <div id="contenido-reporte"></div>
        </div>

        <div class="tab-content" id="tab-nuevo">
            <div class="form-section">
                <h2>Registrar Nuevo Activo Fijo</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="AF-001">
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Computadora de escritorio">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria"></select>
                    </div>
                    <div class="form-group">
                        <label for="fechaAdquisicion">Fecha de Adquisición</label>
                        <input type="date" id="fechaAdquisicion">
                    </div>
                    <div class="form-group">
                        <label for="valorAdquisicion">Valor de Adquisición (CLP)</label>
                        <input type="number" id="valorAdquisicion" min="0">
                    </div>
                    <div class="form-group">
                        <label for="vidaUtil">Vida Útil (años)</label>
                        <input type="number" id="vidaUtil" value="5" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label for="metodoDepreciacion">Método de Depreciación</label>
                        <select id="metodoDepreciacion">
                            <option value="lineal">Lineal</option>
                            <option value="acelerada">Acelerada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tasaAcelerada">Tasa Acelerada (%)</label>
                        <input type="number" id="tasaAcelerada" value="2" min="1" max="5" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles adicionales del activo"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="crearActivo()">✓ Crear Activo</button>
                    <button class="btn-secondary" onclick="limpiarFormulario()">✕ Limpiar</button>
                </div>
                <div id="mensaje-crear"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-baja">
            <div class="form-section">
                <h2>Dar de Baja a Activo</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="activoBaja">Activo a Dar de Baja</label>
                        <select id="activoBaja"></select>
                    </div>
                    <div class="form-group">
                        <label for="fechaBaja">Fecha de Baja</label>
                        <input type="date" id="fechaBaja">
                    </div>
                </div>
                <div class="form-group">
                    <label for="razonBaja">Razón de la Baja</label>
                    <textarea id="razonBaja" rows="3" placeholder="Describe el motivo de la baja del activo"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-danger" onclick="darDeBaja()">🗑️ Confirmar Baja</button>
                    <button class="btn-secondary" onclick="cancelarBaja()">✕ Cancelar</button>
                </div>
                <div id="mensaje-baja"></div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fechaAdquisicion').valueAsDate = new Date();
            document.getElementById('fechaBaja').valueAsDate = new Date();
            cargarReporte();
            cargarCategorias();
            cargarActivosBaja();
        });

        // Cambiar pestaña
        function cambiarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'reporte') {
                cargarReporte();
            }
        }

        // Formatear moneda
        function formatearCLP(valor) {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(valor);
        }

        // Cargar reporte
        async function cargarReporte() {
            try {
                const response = await fetch('/api/activos_fijos.php?accion=reporte');
                const resultado = await response.json();

                if (resultado.success) {
                    mostrarReporte(resultado.data);
                } else {
                    mostrarError(resultado.error);
                }
            } catch (error) {
                mostrarError('Error al cargar reporte: ' + error.message);
            }
        }

        // Mostrar reporte
        function mostrarReporte(datos) {
            const contenido = document.getElementById('contenido-reporte');

            const html = `
                <div class="kpi-cards">
                    <div class="kpi-card">
                        <div class="label">Cantidad de Activos</div>
                        <div class="value">${datos.cantidad_activos}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Valor Bruto Total</div>
                        <div class="value">${formatearCLP(datos.valor_bruto_total)}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Depreciación Acumulada</div>
                        <div class="value">${formatearCLP(datos.depreciacion_acumulada_total)}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Valor Neto Total</div>
                        <div class="value">${formatearCLP(datos.valor_neto_total)}</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="chartCategorias"></canvas>
                </div>

                <h2 style="margin-bottom: 20px; color: #333;">Activos Fijos por Categoría</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Categoría</th>
                                <th class="text-right">Cantidad</th>
                                <th class="text-right">Valor Bruto</th>
                                <th class="text-right">Depreciación</th>
                                <th class="text-right">Valor Neto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(datos.por_categoria).map(([categoria, info]) => `
                                <tr>
                                    <td>${categoria}</td>
                                    <td class="text-right">${info.cantidad}</td>
                                    <td class="text-right currency">${formatearCLP(info.valor_bruto)}</td>
                                    <td class="text-right currency">${formatearCLP(info.depreciacion_acumulada)}</td>
                                    <td class="text-right currency">${formatearCLP(info.valor_neto)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <h2 style="margin-bottom: 20px; margin-top: 40px; color: #333;">Detalle de Activos</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th class="text-right">Valor Bruto</th>
                                <th class="text-right">Depreciación Anual</th>
                                <th class="text-right">Depreciación Acum.</th>
                                <th class="text-right">Valor Neto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${datos.activos.map(a => `
                                <tr>
                                    <td><strong>${a.codigo}</strong></td>
                                    <td>${a.nombre}</td>
                                    <td>${a.categoria}</td>
                                    <td class="text-right currency">${formatearCLP(a.valor_adquisicion)}</td>
                                    <td class="text-right currency">${formatearCLP(a.depreciacion_anual)}</td>
                                    <td class="text-right currency">${formatearCLP(a.depreciacion_acumulada)}</td>
                                    <td class="text-right currency">${formatearCLP(a.valor_neto)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            contenido.innerHTML = html;

            setTimeout(() => {
                const ctx = document.getElementById('chartCategorias');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(datos.por_categoria),
                            datasets: [{
                                data: Object.values(datos.por_categoria).map(c => c.valor_neto),
                                backgroundColor: [
                                    '#667eea',
                                    '#764ba2',
                                    '#f093fb',
                                    '#4facfe',
                                    '#00f2fe',
                                    '#43e97b',
                                    '#fa709a',
                                ],
                            }],
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                },
                            },
                        },
                    });
                }
            }, 100);
        }

        // Cargar categorías
        async function cargarCategorias() {
            try {
                const response = await fetch('/api/activos_fijos.php?accion=listar');
                const resultado = await response.json();

                if (resultado.success && resultado.categorias) {
                    const select = document.getElementById('categoria');
                    select.innerHTML = resultado.categorias
                        .map(cat => `<option value="${cat}">${cat}</option>`)
                        .join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Cargar activos para baja
        async function cargarActivosBaja() {
            try {
                const response = await fetch('/api/activos_fijos.php?accion=listar&estado=vigente');
                const resultado = await response.json();

                if (resultado.success) {
                    const select = document.getElementById('activoBaja');
                    select.innerHTML = resultado.data
                        .map(a => `<option value="${a.id}">${a.codigo} - ${a.nombre}</option>`)
                        .join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Crear activo
        async function crearActivo() {
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const fechaAdquisicion = document.getElementById('fechaAdquisicion').value;
            const valorAdquisicion = parseInt(document.getElementById('valorAdquisicion').value) || 0;
            const vidaUtil = parseInt(document.getElementById('vidaUtil').value) || 5;
            const metodoDepreciacion = document.getElementById('metodoDepreciacion').value;
            const tasaAcelerada = parseFloat(document.getElementById('tasaAcelerada').value) || null;

            if (!codigo || !nombre || !categoria || valorAdquisicion === 0) {
                mostrarErrorCrear('Completa todos los campos requeridos');
                return;
            }

            try {
                const response = await fetch('/api/activos_fijos.php?accion=crear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        codigo, nombre, categoria, fecha_adquisicion: fechaAdquisicion,
                        valor_adquisicion: valorAdquisicion, vida_util_anos: vidaUtil,
                        metodo_depreciacion: metodoDepreciacion,
                        tasa_depreciacion_acelerada: tasaAcelerada,
                    }),
                });

                const resultado = await response.json();
                if (resultado.success) {
                    document.getElementById('mensaje-crear').innerHTML = '<div class="success-message">✓ ' + resultado.message + '</div>';
                    limpiarFormulario();
                    setTimeout(() => cargarActivosBaja(), 1000);
                } else {
                    mostrarErrorCrear(resultado.error);
                }
            } catch (error) {
                mostrarErrorCrear('Error: ' + error.message);
            }
        }

        // Dar de baja
        async function darDeBaja() {
            const activoId = document.getElementById('activoBaja').value;
            const fechaBaja = document.getElementById('fechaBaja').value;
            const razon = document.getElementById('razonBaja').value;

            if (!activoId) {
                mostrarErrorBaja('Selecciona un activo');
                return;
            }

            if (!confirm('¿Confirmar baja del activo? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                const response = await fetch('/api/activos_fijos.php?accion=baja', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        activo_id: activoId,
                        fecha_baja: fechaBaja,
                        razon: razon || 'Baja de activo',
                    }),
                });

                const resultado = await response.json();
                if (resultado.success) {
                    document.getElementById('mensaje-baja').innerHTML = '<div class="success-message">✓ ' + resultado.message + '</div>';
                    setTimeout(() => {
                        cargarReporte();
                        cargarActivosBaja();
                        cambiarTab('reporte');
                    }, 1500);
                } else {
                    mostrarErrorBaja(resultado.error);
                }
            } catch (error) {
                mostrarErrorBaja('Error: ' + error.message);
            }
        }

        // Helpers
        function limpiarFormulario() {
            document.getElementById('codigo').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('valorAdquisicion').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('mensaje-crear').innerHTML = '';
        }

        function cancelarBaja() {
            document.getElementById('razonBaja').value = '';
            document.getElementById('mensaje-baja').innerHTML = '';
        }

        function mostrarErrorCrear(msg) {
            document.getElementById('mensaje-crear').innerHTML = '<div class="error-message">❌ ' + msg + '</div>';
        }

        function mostrarErrorBaja(msg) {
            document.getElementById('mensaje-baja').innerHTML = '<div class="error-message">❌ ' + msg + '</div>';
        }

        function mostrarError(msg) {
            document.getElementById('contenido-reporte').innerHTML = '<div class="error-message">❌ ' + msg + '</div>';
        }
    </script>
<script src="../assets/theme.js"></script>
<button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar tema (claro/oscuro/automático)" aria-label="Alternar tema">🌙</button>
</body>
</html>
