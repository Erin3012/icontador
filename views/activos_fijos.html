<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../assets/theme.css">
    <script src="../assets/empresa-fetch.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activos Fijos - Gestión Patrimonial</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            gap: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            background: #e8e8e8;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .kpi-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .kpi-card .value {
            font-size: 24px;
            font-weight: bold;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            font-weight: 600;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            color: #333;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .currency {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #3c3;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .kpi-cards {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            header h1 {
                font-size: 22px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                flex: 1 1 50%;
            }
        }
    </style>
</head>
<body>
<a href="panel.html" class="volver-panel" style="display:inline-block;margin:10px 20px 0;padding:6px 12px;background:#fff;color:#333;border-radius:6px;text-decoration:none;font:14px/1.4 'Segoe UI',Arial,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25)">&larr; Volver al panel</a>
    <div class="container">
        <header>
            <h1>🏢 Activos Fijos</h1>
            <p>Gestión de activos, depreciaciones y reportes patrimoniales</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('reporte')">📊 Reporte de Activos</button>
            <button class="tab-btn" onclick="cambiarTab('nuevo')">➕ Registrar Activo</button>
            <button class="tab-btn" onclick="cambiarTab('baja')">🗑️ Dar de Baja</button>
        </div>

        <div class="tab-content active" id="tab-reporte">
            <div id="contenido-reporte"></div>
        </div>

        <div class="tab-content" id="tab-nuevo">
            <div class="form-section">
                <h2>Registrar Nuevo Activo Fijo</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="AF-001">
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Computadora de escritorio">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria"></select>
                    </div>
                    <div class="form-group">
                        <label for="fechaAdquisicion">Fecha de Adquisición</label>
                        <input type="date" id="fechaAdquisicion">
                    </div>
                    <div class="form-group">
                        <label for="valorAdquisicion">Valor de Adquisición (CLP)</label>
                        <input type="number" id="valorAdquisicion" min="0">
                    </div>
                    <div class="form-group">
                        <label for="vidaUtil">Vida Útil (años)</label>
                        <input type="number" id="vidaUtil" value="5" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label for="metodoDepreciacion">Método de Depreciación</label>
                        <select id="metodoDepreciacion">
                            <option value="lineal">Lineal</option>
                            <option value="acelerada">Acelerada</option>
                        </select>
                    </div>
                    <div class="form-group" id="grupo-tasa" style="display:none">
                        <label for="tasaAcelerada">Factor de aceleración (2 = el doble de la lineal)</label>
                        <input type="number" id="tasaAcelerada" value="2" min="1" max="5" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles adicionales del activo"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="crearActivo()">✓ Crear Activo</button>
                    <button class="btn-secondary" onclick="limpiarFormulario()">✕ Limpiar</button>
                </div>
                <div id="mensaje-crear"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-baja">
            <div class="form-section">
                <h2>Dar de Baja a Activo</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="activoBaja">Activo a Dar de Baja</label>
                        <select id="activoBaja"></select>
                    </div>
                    <div class="form-group">
                        <label for="fechaBaja">Fecha de Baja</label>
                        <input type="date" id="fechaBaja">
                    </div>
                </div>
                <div class="form-group">
                    <label for="razonBaja">Razón de la Baja</label>
                    <textarea id="razonBaja" rows="3" placeholder="Describe el motivo de la baja del activo"></textarea>
                </div>
                <div class="button-group">
                    <button class="btn-danger" onclick="darDeBaja()">🗑️ Confirmar Baja</button>
                    <button class="btn-secondary" onclick="cancelarBaja()">✕ Cancelar</button>
                </div>
                <div id="mensaje-baja"></div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fechaAdquisicion').value = hoyLocal();
            document.getElementById('fechaBaja').value = hoyLocal();
            const metodo = document.getElementById('metodoDepreciacion');
            const alternarFactor = () => { document.getElementById('grupo-tasa').style.display = metodo.value === 'acelerada' ? '' : 'none'; };
            metodo.addEventListener('change', alternarFactor);
            alternarFactor();
            cargarReporte();
            cargarCategorias();
            cargarActivosBaja();
        });

        // Cambiar pestaña
        function cambiarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById('mensaje-crear').innerHTML = '';
            document.getElementById('mensaje-baja').innerHTML = '';
            const botones = document.querySelectorAll('.tab-btn');
            const posicion = ['reporte', 'nuevo', 'baja'].indexOf(tab);
            if (botones[posicion]) botones[posicion].classList.add('active');

            if (tab === 'reporte') {
                cargarReporte();
            }
        }

        function esc(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Fecha de hoy en la zona horaria local (valueAsDate usaría UTC y de noche ya sería el día siguiente en Chile)
        function hoyLocal() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        let tokenCsrf = null;
        async function escribirActivos(accion, cuerpo) {
            for (let intento = 0; intento < 2; intento++) {
                if (!tokenCsrf) {
                    const t = await fetch('/api/activos_fijos.php?csrf=1', { cache: 'no-store' });
                    const dt = await t.json().catch(() => ({}));
                    if (!t.ok || !dt.csrf) throw new Error(dt.error || 'No se pudo validar la sesión.');
                    tokenCsrf = dt.csrf;
                }
                const response = await fetch('/api/activos_fijos.php?accion=' + accion, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': tokenCsrf },
                    body: JSON.stringify(cuerpo),
                });
                const resultado = await response.json().catch(() => ({}));
                if (response.status === 403 && intento === 0) { tokenCsrf = null; continue; }
                // Una respuesta que no es JSON (error del proxy, fallo de PHP) no debe mostrarse como un mensaje vacío.
                if (!resultado.success && !resultado.error) resultado.error = 'Error inesperado del servidor (HTTP ' + response.status + '). Reintenta en unos segundos.';
                return resultado;
            }
        }

        // Formatear moneda
        function formatearCLP(valor) {
            return new Intl.NumberFormat('es-CL', {
                style: 'currency',
                currency: 'CLP',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(valor);
        }

        // Cargar reporte
        let cargaReporte = 0;
        let graficoCategorias = null;
        async function cargarReporte() {
            const numero = ++cargaReporte; // si hay varias cargas en vuelo, solo se dibuja la última
            try {
                const response = await fetch('/api/activos_fijos.php?accion=reporte');
                const resultado = await response.json();
                if (numero !== cargaReporte) return;

                if (resultado.success) {
                    mostrarReporte(resultado.data);
                } else {
                    mostrarError(resultado.error);
                }
            } catch (error) {
                mostrarError('Error al cargar reporte: ' + error.message);
            }
        }

        // Mostrar reporte
        function mostrarReporte(datos) {
            const contenido = document.getElementById('contenido-reporte');

            const html = `
                <div class="kpi-cards">
                    <div class="kpi-card">
                        <div class="label">Cantidad de Activos</div>
                        <div class="value">${datos.cantidad_activos}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Valor Bruto Total</div>
                        <div class="value">${formatearCLP(datos.valor_bruto_total)}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Depreciación Acumulada</div>
                        <div class="value">${formatearCLP(datos.depreciacion_acumulada_total)}</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Valor Neto Total</div>
                        <div class="value">${formatearCLP(datos.valor_neto_total)}</div>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="chartCategorias"></canvas>
                </div>

                <h2 style="margin-bottom: 20px; color: #333;">Activos Fijos por Categoría</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Categoría</th>
                                <th class="text-right">Cantidad</th>
                                <th class="text-right">Valor Bruto</th>
                                <th class="text-right">Depreciación</th>
                                <th class="text-right">Valor Neto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(datos.por_categoria).map(([categoria, info]) => `
                                <tr>
                                    <td>${esc(categoria)}</td>
                                    <td class="text-right">${info.cantidad}</td>
                                    <td class="text-right currency">${formatearCLP(info.valor_bruto)}</td>
                                    <td class="text-right currency">${formatearCLP(info.depreciacion_acumulada)}</td>
                                    <td class="text-right currency">${formatearCLP(info.valor_neto)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <h2 style="margin-bottom: 20px; margin-top: 40px; color: #333;">Detalle de Activos</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th class="text-right">Valor Bruto</th>
                                <th class="text-right">Depreciación Anual</th>
                                <th class="text-right">Depreciación Acum.</th>
                                <th class="text-right">Valor Neto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${datos.activos.map(a => `
                                <tr>
                                    <td><strong>${esc(a.codigo)}</strong></td>
                                    <td>${esc(a.nombre)}</td>
                                    <td>${esc(a.categoria)}</td>
                                    <td class="text-right currency">${formatearCLP(a.valor_adquisicion)}</td>
                                    <td class="text-right currency">${formatearCLP(a.depreciacion_anual)}</td>
                                    <td class="text-right currency">${formatearCLP(a.depreciacion_acumulada)}</td>
                                    <td class="text-right currency">${formatearCLP(a.valor_neto)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            if (graficoCategorias) { graficoCategorias.destroy(); graficoCategorias = null; }
            contenido.innerHTML = html;

            const ctx = document.getElementById('chartCategorias');
            if (ctx && typeof Chart !== 'undefined') {
                graficoCategorias = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(datos.por_categoria),
                        datasets: [{
                            data: Object.values(datos.por_categoria).map(c => c.valor_neto),
                            backgroundColor: [
                                '#667eea',
                                '#764ba2',
                                '#f093fb',
                                '#4facfe',
                                '#00f2fe',
                                '#43e97b',
                                '#fa709a',
                            ],
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                            },
                        },
                    },
                });
            }
        }

        // Cargar categorías
        async function cargarCategorias() {
            try {
                const response = await fetch('/api/activos_fijos.php?accion=listar');
                const resultado = await response.json();

                if (resultado.success && resultado.categorias) {
                    const select = document.getElementById('categoria');
                    select.innerHTML = resultado.categorias
                        .map(cat => `<option value="${esc(cat)}">${esc(cat)}</option>`)
                        .join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Cargar activos para baja
        async function cargarActivosBaja() {
            try {
                const response = await fetch('/api/activos_fijos.php?accion=listar&estado=vigente');
                const resultado = await response.json();

                if (resultado.success) {
                    const select = document.getElementById('activoBaja');
                    select.innerHTML = resultado.data.length
                        ? resultado.data.map(a => `<option value="${esc(a.id)}">${esc(a.codigo)} - ${esc(a.nombre)}</option>`).join('')
                        : '<option value="">No hay activos vigentes</option>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Crear activo
        async function crearActivo() {
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const categoria = document.getElementById('categoria').value;
            const fechaAdquisicion = document.getElementById('fechaAdquisicion').value;
            const textoValor = document.getElementById('valorAdquisicion').value.trim();
            const textoVida = document.getElementById('vidaUtil').value.trim();
            const metodoDepreciacion = document.getElementById('metodoDepreciacion').value;
            const textoTasa = document.getElementById('tasaAcelerada').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();

            // Se valida lo que escribió la persona en vez de corregirlo en silencio (antes 0 o vacío se enviaban como 5 años).
            if (!codigo.trim() || !nombre.trim() || !categoria) {
                mostrarErrorCrear('Completa código, nombre y categoría.');
                return;
            }
            if (!fechaAdquisicion) {
                mostrarErrorCrear('Indica la fecha de adquisición.');
                return;
            }
            if (!/^\d+$/.test(textoValor) || Number(textoValor) < 1) {
                mostrarErrorCrear('El valor de adquisición debe ser un número entero mayor a cero (sin decimales ni separadores).');
                return;
            }
            if (!/^\d+$/.test(textoVida) || Number(textoVida) < 1 || Number(textoVida) > 100) {
                mostrarErrorCrear('La vida útil debe ser un número entero de años entre 1 y 100.');
                return;
            }
            const tasaAcelerada = metodoDepreciacion === 'acelerada' ? Number(textoTasa) : null;
            if (metodoDepreciacion === 'acelerada' && (!textoTasa || !(tasaAcelerada >= 1 && tasaAcelerada <= 5))) {
                mostrarErrorCrear('El factor de aceleración debe estar entre 1 y 5.');
                return;
            }
            const valorAdquisicion = Number(textoValor);
            const vidaUtil = Number(textoVida);

            try {
                const resultado = await escribirActivos('crear', {
                    codigo, nombre, categoria, fecha_adquisicion: fechaAdquisicion,
                    valor_adquisicion: valorAdquisicion, vida_util_anos: vidaUtil,
                    metodo_depreciacion: metodoDepreciacion,
                    tasa_depreciacion_acelerada: tasaAcelerada,
                    descripcion,
                });
                if (resultado.success) {
                    limpiarFormulario();
                    document.getElementById('mensaje-crear').innerHTML = '<div class="success-message">✓ ' + esc(resultado.message) + '</div>';
                    cargarActivosBaja();
                } else {
                    mostrarErrorCrear(resultado.error);
                }
            } catch (error) {
                mostrarErrorCrear('Error: ' + error.message);
            }
        }

        // Dar de baja
        async function darDeBaja() {
            const activoId = document.getElementById('activoBaja').value;
            const fechaBaja = document.getElementById('fechaBaja').value;
            const razon = document.getElementById('razonBaja').value;

            if (!activoId) {
                mostrarErrorBaja('Selecciona un activo');
                return;
            }

            if (!confirm('¿Confirmar baja del activo? Esta acción no se puede deshacer.')) {
                return;
            }

            const boton = document.querySelector('#tab-baja .btn-danger');
            boton.disabled = true;
            try {
                const resultado = await escribirActivos('baja', {
                    activo_id: Number(activoId),
                    fecha_baja: fechaBaja,
                    razon: razon || 'Baja de activo',
                });
                if (resultado.success) {
                    document.getElementById('razonBaja').value = '';
                    document.getElementById('mensaje-baja').innerHTML = '<div class="success-message">✓ ' + esc(resultado.message) + '</div>';
                    cargarActivosBaja(); // el activo dado de baja deja de ofrecerse de inmediato
                    setTimeout(() => cambiarTab('reporte'), 1500); // cambiarTab recarga el reporte y limpia los mensajes
                } else {
                    mostrarErrorBaja(resultado.error);
                }
            } catch (error) {
                mostrarErrorBaja('Error: ' + error.message);
            } finally {
                boton.disabled = false;
            }
        }

        // Helpers
        function limpiarFormulario() {
            document.getElementById('codigo').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('valorAdquisicion').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('mensaje-crear').innerHTML = '';
        }

        function cancelarBaja() {
            document.getElementById('razonBaja').value = '';
            document.getElementById('mensaje-baja').innerHTML = '';
        }

        function mostrarErrorCrear(msg) {
            document.getElementById('mensaje-crear').innerHTML = '<div class="error-message">❌ ' + esc(msg) + '</div>';
        }

        function mostrarErrorBaja(msg) {
            document.getElementById('mensaje-baja').innerHTML = '<div class="error-message">❌ ' + esc(msg) + '</div>';
        }

        function mostrarError(msg) {
            document.getElementById('contenido-reporte').innerHTML = '<div class="error-message">❌ ' + esc(msg) + '</div>';
        }
    </script>
<script src="../assets/theme.js"></script>
<button id="theme-toggle-btn" class="theme-toggle-btn" title="Cambiar tema (claro/oscuro/automático)" aria-label="Alternar tema">🌙</button>
</body>
